[workspace]
resolver = "2"
members = ["crates/core", "crates/store", "crates/cli", "crates/wallet", "crates/p2p", "crates/wallet-ffi"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
blake3 = "1"
borsh = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
datu-core = { path = "crates/core" }
datu-store = { path = "crates/store" }
datu-wallet = { path = "crates/wallet" }
datu-p2p = { path = "crates/p2p" }
mdns-sd = "0.21"
ed25519-dalek = { version = "2", features = ["rand_core"] }
fips204 = "0.5"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
base64 = "0.22"
argon2 = "0.5"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
