# Gitleaks configuration: the default rule set, with two documented
# allowlist groups. The one historical entry covers throwaway service
# container passwords that briefly lived in CI; the rest are values that
# look like secrets to the generic-api-key rule but are not:
#   - public keys and canonical signing test vectors, which must stay
#     byte-identical across languages (Rust, JS, Python) to verify signatures
#   - code identifiers whose names contain "signature" or "derived"
[extend]
useDefault = true

[[allowlists]]
description = "Throwaway CI service-container passwords in history"
regexTarget = "match"
regexes = ['''(?i)(postgres|mysql)://(postgres|root):secret@''']
paths = ['''.github/workflows/ci\.yml''']

[[allowlists]]
description = "Public demo key used as a test constant (not a secret: it verifies, it cannot sign)"
paths = ['''sdk/datu-client/test/identity\.test\.mjs''']

[[allowlists]]
description = "Canonical signing vector: deterministic test key shared across Rust, JS and Python verifiers"
paths = ['''crates/core/tests/fixtures/canonical_vectors\.json''']

[[allowlists]]
description = "Code identifiers matched by the generic-api-key heuristic"
regexTarget = "match"
regexes = [
  '''\bsignatureB64\b''',
  '''\bBLAKE3-derived\b''',
]
