name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned so a fresh stable release cannot turn CI red through a new
      # lint alone; bump deliberately, after running the gates locally.
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: format
        run: cargo fmt --check
      - name: sources are text (no NUL bytes)
        run: python3 deploy/checks/no-nul.py
      - name: clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test (release, whole workspace)
        run: cargo test --workspace --release
      - name: release binaries for drills
        run: cargo build --release -p datu-cli -p datu-indexer
      - name: drills (backup/restore, crash recovery, bounded soak, fork, key rotation, ghost enrollment)
        run: |
          ./deploy/drills/backup-restore.sh
          ./deploy/drills/crash-recovery.sh
          ./deploy/drills/soak.sh 100
          ./deploy/drills/fork-drill.sh
          ./deploy/drills/key-rotation.sh
          ./deploy/drills/enroll-ghost.sh
      - name: dependency inventory + SPDX SBOM (denied licenses)
        run: |
          python3 deploy/checks/inventory.py
          python3 deploy/checks/spdx.py
          python3 -c "import json; d = json.load(open('sbom.spdx.json')); assert d['spdxVersion'] == 'SPDX-2.3' and d['packages'], 'SBOM must stay valid SPDX 2.3'"
      - name: canonical bytes fixtures (Rust, JS, Python)
        run: |
          node deploy/checks/verify-canonical.mjs
          python3 deploy/checks/verify-canonical.py

  indexer-dialects:
    name: projection drivers (SQLite + PostgreSQL + MySQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: datu_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: secret
          MARIADB_DATABASE: datu_test
        ports: ["53306:3306"]
        options: >-
          --health-cmd "mariadb-admin ping -uroot -psecret"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: dialect roundtrips
        env:
          DATU_TEST_PG_URL: postgres://postgres:secret@127.0.0.1:55432/datu_test
          DATU_TEST_MYSQL_URL: mysql://root:secret@127.0.0.1:53306/datu_test
        run: cargo test -p datu-indexer --features "postgres mysql"

  audit:
    name: dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Direct cargo-audit instead of rustsec/audit-check: the action's
      # check-run annotation path fails with "Not Found" on the warning
      # branch even with checks: write, and we want vulnerabilities to be
      # the only failing condition. Unmaintained/unsound warnings are
      # reported but accepted: paste and proc-macro-error2 are build-time
      # proc-macro deps, and lru arrives via mdns-sd with its unsound paths
      # unreached. Revisit when those crates update their trees.
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: cargo audit
        run: |
          cargo install --locked cargo-audit --version 0.23.0
          cargo audit

  rust-macos:
    name: rust workspace tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (whole workspace)
        run: cargo test --workspace
      - name: release binaries build
        run: cargo build --release -p datu-cli -p datu-indexer

  docs:
    name: rustdoc builds warning-free
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc (warnings are errors)
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --workspace --no-deps

  reproducible:
    name: release build is bit-reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - name: two checkouts, two builds, hashes must match
        run: ./deploy/checks/reproducible.sh

  web:
    name: web builds and extension scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: extension scripts parse
        run: |
          node --check web/wallet-extension/panel.js
          node --check web/wallet-extension/background.js
          node --check web/wallet-extension/inject.js
          node --check web/wallet-extension/passkey.js
          node --check web/wallet-extension/webauthn.js
      - name: extension pure-logic tests
        run: node --test web/wallet-extension/test/blake3.test.mjs web/wallet-extension/test/coverage.test.mjs web/wallet-extension/test/passkey.test.mjs web/wallet-extension/test/webauthn.test.mjs
      - name: datu client SDK tests
        run: node --test sdk/datu-client/test/*.test.mjs
      - name: react hooks package tests
        working-directory: sdk/datu-react
        run: |
          npm install --no-package-lock --no-save ../datu-client
          npm install --no-package-lock --no-save react react-dom jsdom
          npm test
      - name: hello-datu starter tests
        working-directory: examples/hello-datu
        run: |
          npm install --no-package-lock --no-save ../../sdk/datu-client
          npm test
      - name: python RP verifier tests
        run: python3 -m unittest discover -s sdk/rp-verifier-python
      - name: registrar build and tests
        working-directory: web/registrar
        run: |
          npm ci
          npm run build
          npm test

  lab:
    name: laboratory builds and smoke-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: release binary for the sandboxes
        run: cargo build --release -p datu-cli
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: install, build, unit tests
        working-directory: web/lab
        run: |
          npm ci
          npm run build
          npm test
      - name: backend smoke (real binary, two sandboxes)
        working-directory: web/lab
        run: npm run smoke
      - name: sign-in demo smoke (relying party verifies a signed assertion)
        working-directory: web/signin-demo
        run: |
          npm ci
          npm run smoke
