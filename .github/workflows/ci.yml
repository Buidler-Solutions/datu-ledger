name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: rust workspace tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test (release, whole workspace)
        run: cargo test --workspace --release

  web:
    name: web builds and extension scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: extension scripts parse
        run: |
          node --check web/wallet-extension/panel.js
          node --check web/wallet-extension/background.js
          node --check web/wallet-extension/inject.js
      - name: extension pure-logic tests
        run: node --test web/wallet-extension/test/blake3.test.mjs web/wallet-extension/test/coverage.test.mjs
      - name: registrar build
        working-directory: web/registrar
        run: npm ci && npm run build
