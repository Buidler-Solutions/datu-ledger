name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    name: datu (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          - os: macos-13
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked -p datu-cli --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="datu-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/datu" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: datu-${{ matrix.target }}
          path: dist/*.tar.gz*

  web:
    name: web bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: zip the Signet side-panel extension
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zip
          tag="${GITHUB_REF_NAME}"
          (cd web/wallet-extension && zip -q -r "../../datu-${tag}-signet-extension.zip" . -x "test/*")
      - name: build and zip the registrar dApp
        shell: bash
        working-directory: web/registrar
        run: |
          set -euo pipefail
          npm ci
          npm run build
          (cd dist && zip -q -r "../../../datu-${GITHUB_REF_NAME}-registrar-dapp.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundles
          path: datu-*.zip

  publish:
    name: github release
    needs: [binaries, web]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
