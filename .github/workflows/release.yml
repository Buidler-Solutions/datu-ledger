name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # Keyless signing (Sigstore) exchanges the workflow's OIDC token for a
  # short-lived certificate; verification instructions live in
  # deploy/operations/release-signing.md.
  id-token: write

jobs:
  binaries:
    name: datu (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
          # Both macOS targets build on the arm64 runner: rustc and clang
          # cross-arch, and the Intel runner pool is permanently congested.
          - os: macos-15
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build (reproducible recipe)
        run: |
          set -euo pipefail
          # Same recipe as deploy/checks/reproducible.sh: remapped paths and
          # a pinned epoch make the binary bytes depend on the tag's source,
          # not on the runner's workspace, so anyone can rebuild and compare.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          export RUSTFLAGS="--remap-path-prefix=$(pwd)=/usr/src/datu --remap-path-prefix=$HOME/.cargo/registry=/usr/src/cargo"
          cargo build --release --locked -p datu-cli --target ${{ matrix.target }}
      - name: package (deterministic archive)
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          name="datu-${tag}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/datu" "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          # sorted entries, pinned mtimes, gzip mtime 0: stable across
          # machines and reruns (deploy/checks/deterministic-tar.py)
          python3 deploy/checks/deterministic-tar.py dist "${name}"
          (cd dist && shasum -a 256 "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: actions/upload-artifact@v5
        with:
          name: datu-${{ matrix.target }}
          path: dist/*.tar.gz*

  web:
    name: web bundles
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: zip the Signet side-panel extension
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update && sudo apt-get install -y zip
          tag="${GITHUB_REF_NAME}"
          (cd web/wallet-extension && zip -q -r "../../datu-${tag}-signet-extension.zip" . -x "test/*")
      - name: build and zip the registrar dApp
        shell: bash
        working-directory: web/registrar
        run: |
          set -euo pipefail
          npm ci
          npm run build
          (cd dist && zip -q -r "../../../datu-${GITHUB_REF_NAME}-registrar-dapp.zip" .)
      - uses: actions/upload-artifact@v5
        with:
          name: web-bundles
          path: datu-*.zip

  publish:
    name: github release
    needs: [binaries, web]
    runs-on: ubuntu-22.04
    steps:
      # The curated release note lives in the repo; the artifacts came from
      # other jobs, so check out to reach docs/release-notes/<tag>.md.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: SBOM (SPDX 2.3 over cargo + npm)
        run: |
          python3 deploy/checks/spdx.py
          cp sbom.spdx.json artifacts/
      - name: combined checksums
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS*' -print0 \
            | sort -z | xargs -0 shasum -a 256 > SHA256SUMS
          cat SHA256SUMS
      - uses: sigstore/cosign-installer@v3
      - name: sign the checksums (keyless)
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          # Sigstore keyless: cosign exchanges this workflow's OIDC token
          # for a short-lived certificate and signs with a one-time key;
          # the signature and certificate are published beside the sums.
          # Verification: deploy/operations/release-signing.md
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
