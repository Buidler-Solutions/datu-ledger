name: Secret Gate (Gitleaks)

# Full-history secret scan with the default rule set. The one allowlist entry
# in .gitleaks.toml covers the throwaway service-container passwords that
# briefly lived in CI history; the working tree carries none.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
